name: validate

on:
  push:
  pull_request:
  workflow_dispatch:
  # Repository switched from private to public: run the HACS check it was waiting for.
  public:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      # Official Home Assistant and HACS checks, used as documented (moving refs, read-only token).
      - uses: home-assistant/actions/hassfest@master
  hacs:
    # HACS only validates (and installs) public repositories: skipped while private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
