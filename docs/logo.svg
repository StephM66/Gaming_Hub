      <stop offset="0" stop-color="#5b21d6"/>
      <stop offset="0.55" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#ff6b8b"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140834"/>
      <stop offset="0.62" stop-color="#3a1272"/>
      <stop offset="1" stop-color="#1c0a44"/>
    </linearGradient>
    <linearGradient id="horizonglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#ff4fd8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7f8f"/>
      <stop offset="0.5" stop-color="#ff4f9a"/>
      <stop offset="1" stop-color="#b026d3"/>
    </linearGradient>
    <linearGradient id="letter" gradientUnits="userSpaceOnUse" x1="350" y1="246" x2="560" y2="681">
